name: Generate Wallpaper List

on:
  push:
    paths:
      - 'images/**' # Only runs when add/change happens inside the images folder

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows GitHub to save the generated file back to the repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Install compression tools for all three formats (JPG, PNG, WebP)
    - name: Install Optimization Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y jpegoptim pngquant webp

        # Compress images in-place without changing any file extensions
    - name: Optimize Images In-Place
      run: |
        # 1. Compress JPEGs to 85% quality
        find images/ -type f \( -name "*.jpg" -o -name "*.jpeg" \) -exec jpegoptim --max=85 --strip-all {} \;
        
        # 2. Compress PNGs forcefully while overwriting the old file
        find images/ -type f -name "*.png" -exec pngquant --ext .png --force --speed 1 --skip-if-larger {} \;

        # 3. Compress WebP files safely in-place at 85% quality (Fixed command)
        find images/ -type f -name "*.webp" | while read -r file; do
          cwebp -q 85 "$file" -o "${file}.tmp" && mv "${file}.tmp" "$file"
        done


    # Scan all optimized files (JPG, PNG, JPEG, WebP) and build the JSON array
    - name: Run Scan Script
      run: |
        echo "[" > wallpapers.json
        find images/ -type f \( -name "*.jpg" -o -name "*.png" -o -name "*.jpeg" -o -name "*.webp" \) | sort | while read -r line; do
          echo "  \"$line\"," >> wallpapers.json
        done
        if [ -s wallpapers.json ]; then
          sed -i '$ s/,$//' wallpapers.json
        fi
        echo "]" >> wallpapers.json

    # Commit the optimized images and the updated JSON list
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add images/ wallpapers.json
        git diff-index --quiet HEAD || git commit -m "Optimize image sizes (JPG/PNG/WebP) and update wallpaper list [skip ci]" && git push
